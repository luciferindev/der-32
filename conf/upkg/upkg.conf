# /etc/upkg/upkg.conf -- upkg(8) options.  All keys are optional.
[options]
# Directories (relative to /) packages may install into.
prefixes = usr/local
# Source recipes for "upkg build".
portsdir = /usr/ports
builddir = /var/tmp/upkg-build
# Unprivileged account used for source builds started by root.
build_user = nobody
# Extra CA bundle for HTTPS repositories (default: system trust store).
#ca_file = /etc/openssl/certs/my-ca.pem
# Plain HTTP is refused unless enabled; indexes are signed either way.
allow_http = no
