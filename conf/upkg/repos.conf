# /etc/upkg/repos.conf -- upkg(8) repositories.
# Higher priority wins when a package is offered by several repositories;
# "upkg install repo/name" selects one explicitly.
#
# der32-*: the official online repositories, served over HTTPS from the
# project site and signed with the DER/32 release key
# (/etc/upkg/keys/der32-release.pub).  They win over the copies on the
# medium when both offer a package.
#
# core, extra, community: the same repositories as they were when this
# release was built, on the image itself, so upkg works without a network.
# Signed with the key of whoever built the image.

[der32-core]
url = https://luciferindev.github.io/der-32/repo/0.1/amd64/core
priority = 120
enabled = yes

[der32-extra]
url = https://luciferindev.github.io/der-32/repo/0.1/amd64/extra
priority = 90
enabled = yes

[der32-community]
url = https://luciferindev.github.io/der-32/repo/0.1/amd64/community
priority = 60
enabled = yes

[core]
url = file:///usr/share/upkg/repos/core
priority = 100
enabled = yes

[extra]
url = file:///usr/share/upkg/repos/extra
priority = 80
enabled = yes

[community]
url = file:///usr/share/upkg/repos/community
priority = 50
enabled = yes

# Remote repositories use HTTPS, e.g.:
#[example]
#url = https://example.org/der32/0.1/amd64/core
#priority = 10
#enabled = no
