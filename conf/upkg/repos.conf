# /etc/upkg/repos.conf -- upkg(8) repositories.
# Higher priority wins when a package is offered by several repositories;
# "upkg install repo/name" selects one explicitly.
#
# DER/32 0.1 Genesis ships its official *test* repositories on the image.
# They are signed with the DER/32 test key in /etc/upkg/keys/.

[core]
url = file:///usr/share/upkg/repos/core
priority = 100
enabled = yes

[extra]
url = file:///usr/share/upkg/repos/extra
priority = 80
enabled = yes

[community]
url = file:///usr/share/upkg/repos/community
priority = 50
enabled = yes

# Remote repositories use HTTPS, e.g.:
#[example]
#url = https://example.org/der32/0.1/amd64/core
#priority = 10
#enabled = no
